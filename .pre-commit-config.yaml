# Pre-commit configuration for TypeScript projects.
# Reference: https://pre-commit.com/hooks.html
#
# Setup:
#   1. Install pre-commit:    pipx install pre-commit  (or: brew install pre-commit)
#   2. Install gitleaks:       brew install gitleaks    (or see https://github.com/gitleaks/gitleaks)
#   3. Install Go toolchain:   brew install go          (required once for the trufflehog hook build)
#   4. Install hooks:          pre-commit install
#   5. Validate:               pre-commit run --all-files
#
# This config handles file hygiene + secret scanning. TypeScript linting and
# formatting (Biome) and commit message enforcement (commitlint) are handled by
# Husky via lint-staged (see .husky/). Both hook managers are needed for full
# coverage:
#   pre-commit install   # file hygiene + secrets
#   npx husky init        # Biome (lint-staged) + commitlint (commit-msg)
#
# Always prefer existing hooks from the pre-commit ecosystem over writing custom
# ones (see https://pre-commit.com/hooks.html). If no existing hook can satisfy a
# requirement, flag it and request input before adding a custom hook. Bump
# hook revisions deliberately.

default_stages: [pre-commit]

repos:
  # --- General file checks ---
  # https://github.com/pre-commit/pre-commit-hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]

  # --- Secret scanning (pre-commit) ---
  # https://github.com/gitleaks/gitleaks
  # Lightweight regex-based scanner using the system binary (brew install gitleaks).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # https://github.com/trufflesecurity/trufflehog
  # Deeper scanner with API verification. Managed golang hook: pre-commit
  # builds the binary in an isolated GOPATH on first run (slow; cached after).
  # Requires the Go toolchain.
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.96.0
    hooks:
      - id: trufflehog

  # --- Shell scripts ---
  # https://github.com/shellcheck-py/shellcheck-py
  # Bundles its own shellcheck binary; no system install required.
  # To also enforce bash style (optional), add:
  #   - repo: https://github.com/openstack/bashate
  #     rev: <rev>
  #     hooks:
  #       - id: bashate
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

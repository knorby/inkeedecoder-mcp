name: Release

# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret needed.
#
# STAGED WORKFLOW: this file lives in `workflow-templates/` and is INERT in
# the template repo. GitHub only picks up workflows from
# `.github/workflows/`. To activate it in a repo created from this template:
#
#   git mv workflow-templates/release.yml .github/workflows/release.yml
#
# Prerequisites (one-time setup, see README "Releasing"):
#   - A GitHub environment named `release` (repo Settings → Environments).
#   - A trusted publisher configured on npmjs.com for this package pointing
#     at this repository, workflow path `.github/workflows/release.yml`, and
#     environment `release` (all must match exactly).
#   - npm >= 11.5.1 for OIDC. The publish job pins Node 24 (which ships a
#     compatible npm) and upgrades to npm@latest anyway, because Node 22's
#     bundled npm 10.x cannot perform OIDC token exchange.
#
# Runs on every push to main. The `select-mode` job inspects repo state and
# picks what happens next:
#   - changesets found          -> `version` job runs `changeset version`
#     (bumps package.json, updates CHANGELOG.md, deletes the consumed
#     changesets) and opens or updates a "Version Packages" pull request.
#     Merging that PR triggers this workflow again, landing in publish mode.
#   - new version not yet on
#     npm (no changesets left) -> `pack` job builds and packs the packages;
#     `publish` job publishes via OIDC, pushes git tags, and creates a
#     GitHub Release.
#   - nothing to do             -> all downstream jobs are skipped (no-op).
#
# Permissions follow the changesets trusted-publishing guidance: top-level
# permissions are reset to none and each job receives only what it needs —
# `id-token: write` exists solely on the publish job.

on:
  push:
    branches: [main]
  # Manual trigger: lets you re-run select-mode (e.g. to retry a publish
  # after a transient failure) without pushing an empty commit.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  select-mode:
    name: Select Changesets mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # recommended: do not persist git credentials on disk
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Select Changesets mode
        id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    name: Version Packages PR
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to commit version changes (changesets/action/version)
      pull-requests: write # to create/update the Version Packages PR
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create or update the Version Packages pull request
        id: version
        uses: changesets/action/version@v2

  pack:
    name: Build and pack packages
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # to check out repo (actions/checkout)
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack packages for publishing
        id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: write # to check out repo and create GitHub Releases (changesets/action/publish)
      id-token: write # for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Node 24's bundled npm still may not satisfy npm >= 11.5.1 for OIDC.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm ci
      - name: Publish packed packages
        uses: changesets/action/publish@v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

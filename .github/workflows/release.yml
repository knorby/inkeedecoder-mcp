name: Release

# Releases when a merged PR bumps the version. The `check` job compares
# package.json's version against the npm registry; if it is unpublished, the
# `release` job runs the metadata suite (version pins across package.json /
# server.json / manifest.json), builds, publishes to npm via OIDC, and
# attaches the `.mcpb` bundle to the `v<version>` GitHub Release.
#
# The version bump travels in the release PR — CI never writes to a branch
# and never opens a PR (a GITHUB_TOKEN-opened PR runs no checks, which is how
# a drifted Version Packages PR slipped through once). No PAT or repository
# secret: only the job-scoped built-in GITHUB_TOKEN plus OIDC.
#
# Prereqs (unchanged, do not rename): the `release` environment and an npm
# trusted publisher registered for THIS workflow filename (release.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    name: Is the package version published?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Check the registry for the package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FOUND="$(npm view "@knorby/inkeedecoder-mcp@${VERSION}" version 2>/dev/null || true)"
          if [ -n "${FOUND}" ]; then UNPUBLISHED=false; else UNPUBLISHED=true; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "unpublished=${UNPUBLISHED}" >> "$GITHUB_OUTPUT"
          echo "package version ${VERSION}: unpublished=${UNPUBLISHED}"

  release:
    name: Publish and create the release
    needs: check
    # workflow_dispatch is the retry path: the publish step re-checks the
    # registry and skips an already-published version; attach is idempotent.
    if: needs.check.outputs.unpublished == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # create the tag/GitHub Release (never pushes a branch)
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      # Node 24's bundled npm may not satisfy npm >= 11.5.1 for OIDC.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest
      - run: npm ci

      # Refuses to publish drifted metadata: the release PR must bump
      # package.json, server.json, and manifest.json together.
      - name: Verify distribution metadata
        run: npx vitest run tests/metadata.test.ts

      - run: npm run build
      - run: npm run test:smoke

      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FOUND="$(npm view "@knorby/inkeedecoder-mcp@${VERSION}" version 2>/dev/null || true)"
          if [ -n "${FOUND}" ]; then
            echo "already published (${FOUND}); attach-only retry"
          else
            npm publish
          fi

      - name: Pack MCPB bundle for Claude Desktop
        run: npm run pack:mcpb

      # This repo has immutable releases on, so assets MUST ride the create
      # call - uploading to an already-published release returns HTTP 422.
      - name: Create the GitHub Release with the MCPB bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "release exists; attempting upload (only works with mutable releases)"
            gh release upload "v${VERSION}" ./*.mcpb --clobber
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes ./*.mcpb
          fi

      # MCP Registry (registry.modelcontextprotocol.io) hosts metadata only;
      # the npm package above is the artifact, so publish after npm. OIDC
      # login needs the job's id-token: write - no secret involved.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to the MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish

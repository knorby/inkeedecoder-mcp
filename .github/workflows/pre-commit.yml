name: Pre-commit

# Runs the same pre-commit suite developers run locally (file hygiene +
# secret scanning) in CI, so it is enforced even when hooks are skipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow only runs local checks against the repo.
permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    # Generous timeout: a cold pre-commit cache rebuilds the trufflehog
    # binary from source (Go build; cached afterward via actions/cache).
    timeout-minutes: 20
    steps:
      # Full history: gitleaks and trufflehog scan commits, not just files.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
      # The gitleaks-system hook expects a system-installed gitleaks binary;
      # version must match .pre-commit-config.yaml.
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # no-commit-to-branch always fails on main pushes in CI by design, so
      # it is skipped here. The trufflehog golang hook uses the Go toolchain
      # preinstalled on ubuntu-latest.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

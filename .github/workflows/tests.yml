name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow only builds and tests. Codecov uploads use
# OIDC (`use_oidc`), so no CODECOV_TOKEN secret is needed on a public repo.
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          use_oidc: true
          files: ./coverage/lcov.info
      # Smoke test: launch the built server through the MCP Inspector CLI and
      # list its tools. Proves the published bin actually speaks MCP — catches
      # a missing shebang, a bundling-only import failure, or a stray write to
      # stdout that would corrupt the JSON-RPC stream.
      - run: npm run test:smoke
      - run: npm audit --audit-level=moderate

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Smoke test: launch the built server through the MCP Inspector CLI and
      # list its tools. Proves the published bin actually speaks MCP — catches
      # a missing shebang, a bundling-only import failure, or a stray write to
      # stdout that would corrupt the JSON-RPC stream.
      - run: npm run test:smoke
      - run: npm audit --audit-level=moderate

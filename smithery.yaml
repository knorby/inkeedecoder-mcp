# Smithery configuration file: https://smithery.ai/docs/build/project-config
startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining the configuration options for the MCP.
    type: object
    description: No configuration needed to start INKEEDecoder MCP Server
  commandFunction:
    # A JS function that produces the CLI command to start the MCP on stdio.
    |-
    (config) => ({ command: 'npx', args: ['-y', '@knorby/inkeedecoder-mcp'], env: {} })
